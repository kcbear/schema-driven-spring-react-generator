name: Global instruments generator CI
on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    # Keep the runner on Ubuntu 24.04 until Playwright supports Ubuntu 26.04.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v6

      - name: Test generator
        run: gradle test

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            e2e/package.json

      - name: Generate sample application
        run: gradle :generator:run --args="--schema ../examples/global-instruments.json --output ../build/generated"

      - name: Compile generated Spring Boot backend
        run: gradle -p build/generated/backend build

      - name: Build generated React application
        run: |
          npm --prefix build/generated/frontend install --no-audit --no-fund
          npm --prefix build/generated/frontend run build

      - name: Install Playwright and Chromium
        working-directory: e2e
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Run Playwright end-to-end tests
        working-directory: e2e
        run: npm test

      - name: Upload Playwright test report and diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-results-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            e2e/playwright-report/
            e2e/test-results/
          if-no-files-found: warn
          retention-days: 1
